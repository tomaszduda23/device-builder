id: xiao_ble
name: Seeed XIAO nRF52840
description: ''
manufacturer: ''
images:
- https://files.seeedstudio.com/wiki/XIAO-BLE/nrf52840_front.jpg
esphome:
  platform: nrf52
  board: xiao_ble
docs_url: https://esphome.io/components/nrf52.html
pins: []
featured_components:
- id: red_led_output
  component_id: output.gpio
  fields:
    pin:
      value:
        number: P0.26
        inverted: true
      locked: true
    id: red_led_output
- id: red_led
  component_id: light.binary
  name: Red LED
  fields:
    output: red_led_output
    id: red_led
    name: Red LED
- id: green_led_output
  component_id: output.gpio
  fields:
    pin:
      value:
        number: P0.30
        inverted: true
      locked: true
    id: green_led_output
- id: green_led
  component_id: light.binary
  name: Green LED
  fields:
    output: green_led_output
    id: green_led
    name: Green LED
- id: blue_led_output
  component_id: output.gpio
  fields:
    pin:
      value:
        number: P0.6
        inverted: true
      locked: true
    id: blue_led_output
- id: blue_led
  component_id: light.binary
  name: Blue LED
  fields:
    output: blue_led_output
    id: blue_led
    name: Blue LED
- id: rgb_led_demo
  component_id: interval
  name: RGB LED Demo
  description: Toggles the red, green and blue LEDs one after another in a loop.
  requires:
  - red_led
  - green_led
  - blue_led
  fields:
    interval: 1500ms
    then:
    - light.toggle: red_led
    - delay: 500ms
    - light.toggle: green_led
    - delay: 500ms
    - light.toggle: blue_led
featured_bundles:
- id: rgb_led
  name: Onboard RGB LED
  component_ids:
  - red_led_output
  - green_led_output
  - blue_led_output
  - red_led
  - green_led
  - blue_led
