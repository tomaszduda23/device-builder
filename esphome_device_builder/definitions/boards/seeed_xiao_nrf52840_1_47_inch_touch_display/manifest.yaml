featured_components:
- id: i2c_bus
  component_id: i2c
  name: I2C Bus (IMU / Touch)
  fields:
    sda:
      value: 4
      locked: true
    scl:
      value: 5
      locked: true
    id:
      value: i2c_bus
      locked: true
- id: imu
  component_id: motion.lsm6ds
  name: LSM6DS3 6-Axis IMU
  fields:
    i2c_id:
      value: i2c_bus
      locked: true
    id: imu
  requires:
  - i2c_bus
- id: backlight_output
  component_id: output.zephyr_pwm
  name: Display Backlight Output
  fields:
    pin:
      value: 37
      locked: true
    id: backlight_output
- id: display_backlight
  component_id: light.monochromatic
  name: Display Backlight
  fields:
    name: Display Backlight
    restore_mode: ALWAYS_ON
    output: backlight_output
    id: display_backlight
  requires:
  - backlight_output
- id: button_a
  component_id: binary_sensor.gpio
  name: User Button 1 (USR1)
  fields:
    pin:
      value:
        number: 35
        mode:
          input: true
          pullup: true
        inverted: true
      locked: true
    name: Button 1
- id: button_b
  component_id: binary_sensor.gpio
  name: User Button 2 (USR2)
  fields:
    pin:
      value:
        number: 10
        mode:
          input: true
          pullup: true
        inverted: true
      locked: true
    name: Button 2
- id: charging
  component_id: binary_sensor.gpio
  name: Battery Charging
  fields:
    pin:
      value:
        number: 17
        mode:
          input: true
          pullup: true
        inverted: true
      locked: true
    name: Battery Charging
    device_class: battery_charging
featured_bundles:
- id: backlight_setup
  name: Display Backlight (full setup)
  component_ids:
